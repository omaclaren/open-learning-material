<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Area IoU and detection-count Jaccard</title>
<desc id="desc">Left: two overlapping boxes; their intersection is shared area and their union is all coloured area. Right: after matching, 14 shared pairs, one unmatched prediction and two unmatched annotations give 17 union items.</desc>
